<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ビジスタ — 応援を投げよう</title><style>
:root{--bg:#0f1013;--card:#1c1d24;--card2:#24252e;--ink:#f2efe6;--ink2:#8f8d97;--gold:#e8b04b;--gold-deep:#c8871d;--red:#e0454f;--line:#2c2d35}
*{box-sizing:border-box;margin:0;font-family:'Hiragino Sans','Noto Sans JP',sans-serif}
body{background:var(--bg);color:var(--ink);min-height:100vh;padding:18px 16px 40px;max-width:520px;margin:0 auto}
.logo{font-weight:900;letter-spacing:.02em;font-size:22px;margin-bottom:2px}
.logo b{color:var(--gold)}
button{font-family:inherit}
.sub{color:var(--ink2);font-size:12px;margin-bottom:16px;line-height:1.6}
.sec{font-size:12px;font-weight:800;letter-spacing:.15em;color:var(--gold);margin:18px 0 8px}
.teams{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.team{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 3px;font-size:12px;line-height:1.35;font-weight:800;color:var(--ink);text-align:center;cursor:pointer}
.team.sel{border-color:var(--gold);background:#221d12;color:var(--gold)}
.team .now{display:block;font-size:9px;color:var(--red);font-weight:900}
textarea{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;color:var(--ink);padding:11px 13px;font-size:14px;height:64px;resize:none}
textarea:focus{outline:2px solid var(--gold)}
input{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:10px;color:var(--ink);padding:9px 13px;font-size:13px}
.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.act{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:13px 6px;font-size:14px;font-weight:800;color:var(--ink);cursor:pointer}
.act:active{transform:scale(.96)}
.act.sel{border-color:var(--gold);background:#221d12;color:var(--gold)}
.send{width:100%;margin-top:14px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#161105;border:0;font-size:16.5px;font-weight:900;padding:16px;border-radius:12px;cursor:pointer}
.send:active{transform:scale(.98)}
.send:disabled{opacity:.4}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);background:var(--gold);color:#161105;font-weight:900;font-size:14px;border-radius:99px;padding:11px 24px;transition:transform .25s;z-index:9;white-space:nowrap}
#toast.on{transform:translateX(-50%) translateY(0)}
a{color:var(--ink2)}
.act.spon{border-color:var(--gold-deep);font-size:12.5px}
#ouenBadge{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#161105;border:0;font-weight:900;text-align:center;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.panel{background:#221d12;border:1.5px solid var(--gold);border-radius:12px;padding:11px 14px;font-size:12.5px;line-height:1.7}
#floatLayer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:8}
.floatR{position:absolute;bottom:-70px;display:flex;flex-direction:column;align-items:center;gap:2px;animation:floatUp 3.6s ease-out forwards}
.floatR .ic{font-size:34px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));animation:wobble 1.1s ease-in-out infinite alternate}
.floatR.big .ic{font-size:46px}
.floatR .bub{max-width:180px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:4px 9px;font-size:11px;line-height:1.45;color:var(--ink);text-align:center;word-break:break-all}
.floatR.big .bub{border-color:var(--gold)}
.floatR .tm{font-size:10px;font-weight:800;color:var(--gold)}
@keyframes floatUp{0%{transform:translateY(0);opacity:0}8%{opacity:1}75%{opacity:1}100%{transform:translateY(-82vh);opacity:0}}
@keyframes wobble{from{transform:translateX(-7px) rotate(-4deg)}to{transform:translateX(7px) rotate(4deg)}}
</style></head><body>
<h1 class="logo">ビジスタ<b>.</b></h1>
<p class="sub" id="evName">読み込み中…</p>
<div id="closedBanner" class="panel" style="display:none;margin-bottom:14px">このイベントは終了しました。応援の受付は締め切っています。</div>
<div id="ouenBadge" style="display:none">🔥 応援タイム！ あと <span id="ouenSec">--</span> 秒 — いま応援を送ろう</div>
<div class="sec">1. チームを選ぶ</div>
<div class="teams" id="teams"></div>
<div id="teamInfo" class="panel" style="display:none;margin-top:10px"><b id="tiName" style="color:var(--gold)"></b><span id="tiDesc"></span></div>
<div class="sec">2. 応援を選ぶ（タップで選択）</div>
<div class="acts" id="acts">
  <button class="act" data-k="user">🙋 利用者になりたい</button>
  <button class="act" data-k="intro">🤝 人を紹介できる</button>
  <button class="act" data-k="spread">📣 広めたい</button>
  <button class="act coin" data-k="coin">🔥 エールを投げる</button>
</div>
<div class="sec">3. ひとことメッセージ（任意・一緒に届きます）</div>
<textarea id="msg" maxlength="120" placeholder="例）その課題、うちの会社でも困ってます！"></textarea>
<div id="coinInfo" style="display:none;font-size:11.5px;color:var(--ink2);text-align:center;margin-top:8px"></div>
<div id="optinBox" style="display:none;margin-top:10px" class="panel">
  <div style="font-size:11.5px;color:var(--gold);font-weight:800;margin-bottom:6px">チームからの連絡を受け取れます（任意）</div>
  <input id="contact" maxlength="100" placeholder="連絡先（メール・SNSアカウントなど）">
  <label style="display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:11px;color:var(--ink2);line-height:1.6"><input type="checkbox" id="consent" style="width:auto;margin-top:2px">連絡先を本イベントの主催者に共有し、応援先チームからの連絡・イベント運営の目的で利用されることに同意します</label>
</div>
<div style="margin-top:8px"><input id="name" maxlength="20" placeholder="お名前（任意・空欄で匿名）"></div>
<button class="send" id="sendBtn">🚀 送信（何回でもOK）</button>
<div class="sec" style="margin-top:24px">みんなの応援（リアルタイム）</div>
<div id="liveFeed" style="display:flex;flex-direction:column;gap:6px"></div>
<div id="sponsorBar" style="display:none;margin-top:22px;font-size:11px;color:var(--ink2);line-height:1.8"></div>
<p style="margin-top:26px;font-size:11px;color:var(--ink2)">結果はイベント後に各チームへ共有されます ／ <a id="resLink" href="#">結果ページ</a></p>
<div id="floatLayer"></div>
<div id="toast">送りました！</div>
<script>
const API = 'https://qfptslfrasgidlaokhpx.supabase.co/functions/v1/ohineri';
const EV = new URLSearchParams(location.search).get('event') || 'demo';
document.getElementById('resLink').href = 'app-results.html?event='+encodeURIComponent(EV);
let TEAMS = [], TEAM_INFO = {}, closed = false;
let team = null, kind = null, currentTeam = '';
let SPONSORS = [], COIN_LIMIT = 3, ouenUntil = 0, stampSel = '', sponsorsJson = '';
let coinUsed = {};
try{ coinUsed = JSON.parse(localStorage.getItem('oh_coinused_'+EV)||'{}'); }catch(e){}
let dev='';try{dev=localStorage.getItem('oh_dev')||'';if(!dev){dev=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('oh_dev',dev);}}catch(e){dev='anon'+Math.floor(Math.random()*1e9);}

function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),1600);}
function showInfo(t){
  const p=document.getElementById('teamInfo');
  const d=TEAM_INFO[t]||'';
  if(!d){p.style.display='none';return;}
  document.getElementById('tiName').textContent=t+'： ';
  document.getElementById('tiDesc').textContent=d;
  p.style.display='block';
}
function renderTeams(){
  const el=document.getElementById('teams'); el.innerHTML='';
  TEAMS.forEach(t=>{
    const b=document.createElement('button');
    b.className='team'+(t===team?' sel':'');
    b.textContent=t;
    if(t===currentTeam){const n=document.createElement('span');n.className='now';n.textContent='▶ 発表中';b.appendChild(n);}
    b.onclick=()=>{team=t;try{localStorage.setItem('oh_team_'+EV,t)}catch(e){};renderTeams();showInfo(t);updateCoinInfo();};
    el.appendChild(b);
  });
}
async function loadConfig(first){
  try{
    const r = await fetch(API+'/api/events?event='+encodeURIComponent(EV));
    if(!r.ok){ document.getElementById('evName').textContent='イベントが見つかりません'; return; }
    const cfg = await r.json();
    TEAMS = cfg.teams.map(t=>t.name);
    TEAM_INFO = {}; cfg.teams.forEach(t=>TEAM_INFO[t.name]=t.info||'');
    closed = cfg.status!=='open';
    COIN_LIMIT = cfg.coin_limit ?? 3;
    ouenUntil = cfg.ouen_until ? Date.parse(cfg.ouen_until) : 0;
    const sj = JSON.stringify(cfg.sponsors||[]);
    if(sj !== sponsorsJson){ sponsorsJson = sj; SPONSORS = cfg.sponsors||[]; renderSponsors(); }
    document.getElementById('evName').textContent = cfg.name+'　応援したいチームを選んで、応援を投げてください。匿名OK・本物のお金は使いません。';
    document.title = cfg.name+' — ビジスタ';
    document.getElementById('closedBanner').style.display = closed?'block':'none';
    document.getElementById('sendBtn').disabled = closed;
    const prevCur = currentTeam; currentTeam = cfg.current_team||'';
    if(first){
      try{ team = localStorage.getItem('oh_team_'+EV); }catch(e){}
      if(team && !TEAMS.includes(team)) team=null;
    }
    if(!team && currentTeam) team = currentTeam;
    if(first || prevCur!==currentTeam) { renderTeams(); if(team) showInfo(team); }
  }catch(e){}
  setTimeout(()=>loadConfig(false), 8000);
}
function renderSponsors(){
  document.querySelectorAll('.act.spon').forEach(x=>x.remove());
  const acts = document.getElementById('acts');
  SPONSORS.forEach(s=>{
    if(!s.name) return;
    const b = document.createElement('button');
    b.className = 'act spon';
    b.dataset.k = 'sponsor'; b.dataset.stamp = s.name;
    b.textContent = (s.stamp||'🏢')+' '+s.name+'スタンプ';
    acts.appendChild(b);
  });
  const bar = document.getElementById('sponsorBar');
  if(SPONSORS.length){
    bar.innerHTML = '';
    bar.appendChild(document.createTextNode('協賛： '));
    SPONSORS.forEach((s,i)=>{
      if(i) bar.appendChild(document.createTextNode(' ／ '));
      let safeUrl = '';
      try{ const u = new URL(s.url); if(['http:','https:'].includes(u.protocol)) safeUrl = u.href; }catch(e){}
      if(safeUrl){ const a=document.createElement('a'); a.href=safeUrl; a.target='_blank'; a.rel='noopener'; a.style.color='var(--gold)'; a.textContent=s.name; bar.appendChild(a); }
      else bar.appendChild(document.createTextNode(s.name));
    });
    bar.style.display = 'block';
  } else bar.style.display = 'none';
}
function updateOptin(){
  document.getElementById('optinBox').style.display = (kind==='user'||kind==='intro') ? 'block' : 'none';
}
function updateCoinInfo(){
  const el = document.getElementById('coinInfo');
  if(kind==='coin' && team){
    const used = coinUsed[team]||0;
    const left = Math.max(0, COIN_LIMIT - used);
    el.textContent = left>0 ? ('🔥 '+team+' へのエール 残り '+left+' 回（各チーム'+COIN_LIMIT+'回まで）') : ('🔥 '+team+' へのエールは上限（'+COIN_LIMIT+'回）に達しています');
    el.style.display = 'block';
  } else el.style.display = 'none';
}
setInterval(()=>{
  const el = document.getElementById('ouenBadge');
  const left = Math.ceil((ouenUntil - Date.now())/1000);
  if(left > 0){ document.getElementById('ouenSec').textContent = left; el.style.display = 'block'; }
  else el.style.display = 'none';
}, 500);
document.getElementById('acts').addEventListener('click', e=>{
  const b = e.target.closest('.act'); if(!b) return;
  kind = b.dataset.k; stampSel = b.dataset.stamp || '';
  document.querySelectorAll('.act').forEach(x=>x.classList.toggle('sel', x===b));
  updateOptin(); updateCoinInfo();
});
let busy=false;
document.getElementById('sendBtn').onclick=async()=>{
  if(busy||closed) return;
  if(!team){ toast('先にチームを選んでください'); return; }
  if(!kind){ toast('応援の種類を選んでください'); return; }
  busy=true;
  try{
    const payload = {event:EV,team,kind,device:dev,message:document.getElementById('msg').value.trim(),name:document.getElementById('name').value.trim()};
    if(kind==='sponsor') payload.stamp = stampSel;
    if(kind==='user'||kind==='intro'){
      payload.contact = document.getElementById('contact').value.trim();
      payload.consent = document.getElementById('consent').checked;
    }
    const res = await fetch(API+'/api/support',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(res.status===429){ toast('このチームへのエールは上限に達しました'); busy=false; updateCoinInfo(); return; }
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      if(err.error==='consent required'){ toast('連絡先を残す場合は同意にチェックしてください'); busy=false; return; }
      throw new Error();
    }
    if(kind==='coin'){ coinUsed[team]=(coinUsed[team]||0)+1; try{localStorage.setItem('oh_coinused_'+EV, JSON.stringify(coinUsed))}catch(e){}; updateCoinInfo(); }
    document.getElementById('msg').value='';
    toast(team+' に送りました！');
  }catch(e){ toast('送信に失敗しました。電波を確認してもう一度'); }
  busy=false;
};
const KINDS_L = {cheer:'👏 応援してる！',user:'🙋 利用者になりたい',intro:'🤝 人を紹介できる',spread:'📣 広めたい',coin:'🔥 エール',sponsor:'🏢 企業スタンプ'};
const KINDS_IC = {cheer:'👏',user:'🙋',intro:'🤝',spread:'📣',coin:'🔥',sponsor:'🏢'};
function kindLabel(row){ return row.kind==='sponsor' ? ('🏢 '+(row.stamp||'企業')+'スタンプ') : (KINDS_L[row.kind]||row.kind); }
function kindIcon(row){ if(row.kind==='sponsor'){ const s=SPONSORS.find(x=>x.name===row.stamp); return (s&&s.stamp)||'🏢'; } return KINDS_IC[row.kind]||'👏'; }
function spawnFloat(row){
  const layer=document.getElementById('floatLayer');
  const f=document.createElement('div');
  f.className='floatR'+(row.kind==='coin'?' big':'');
  f.style.left=(8+Math.random()*72)+'%';
  const ic=document.createElement('div'); ic.className='ic'; ic.textContent=kindIcon(row); f.appendChild(ic);
  const tm=document.createElement('div'); tm.className='tm'; tm.textContent='→ '+row.team; f.appendChild(tm);
  if(row.message){const b=document.createElement('div'); b.className='bub'; b.textContent=row.message; f.appendChild(b);}
  layer.appendChild(f);
  setTimeout(()=>f.remove(), 3800);
}
let feedLast = 0, feedInit = true;
async function pollFeed(){
  try{
    const r = await fetch(API+'/api/feed?event='+encodeURIComponent(EV)+'&after='+feedLast);
    const rows = await r.json();
    const box = document.getElementById('liveFeed');
    rows.forEach((row,i)=>{
      feedLast = Math.max(feedLast, row.id);
      if(!feedInit) setTimeout(()=>spawnFloat(row), Math.min(i,10)*320);
      const d = document.createElement('div');
      d.style.cssText='background:var(--card);border-radius:10px;padding:8px 12px;font-size:12px;line-height:1.55'+(row.kind==='coin'?';border:1px solid var(--gold)':'');
      const who=document.createElement('b'); who.textContent=(row.name||'匿名');
      const to=document.createElement('span'); to.style.color='var(--gold)'; to.style.fontWeight='800'; to.textContent=' → '+row.team+' ';
      const k=document.createElement('span'); k.style.color='var(--ink2)'; k.textContent=kindLabel(row);
      d.appendChild(who); d.appendChild(to); d.appendChild(k);
      if(row.created_at){
        const tt=document.createElement('span');
        tt.style.cssText='float:right;color:var(--ink2);font-size:10.5px';
        try{ tt.textContent=new Date(row.created_at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}); }catch(e){}
        d.appendChild(tt);
      }
      if(row.message){const m=document.createElement('div'); m.textContent='「'+row.message+'」'; d.appendChild(m);}
      box.prepend(d);
      while(box.children.length>8) box.removeChild(box.lastChild);
    });
    feedInit = false;
  }catch(e){}
  setTimeout(pollFeed, 3500);
}
loadConfig(true);
pollFeed();
</script></body></html>
