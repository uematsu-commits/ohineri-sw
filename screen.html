<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ビジスタ スクリーン</title><style>
:root{--bg:#0f1013;--card:#1c1d24;--card2:#24252e;--ink:#f2efe6;--ink2:#8f8d97;--gold:#e8b04b;--gold-deep:#c8871d;--red:#e0454f;--line:#2c2d35}
*{box-sizing:border-box;margin:0;font-family:'Hiragino Sans','Noto Sans JP',sans-serif}
body{background:var(--bg);color:var(--ink);min-height:100vh}
.logo{font-weight:900;letter-spacing:.02em}
.logo b{color:var(--gold)}
button{font-family:inherit}

body{padding:28px 36px;display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{display:flex;align-items:baseline;gap:16px;margin-bottom:18px}
h1{font-size:26px}
.total{margin-left:auto;font-size:15px;color:var(--ink2)}
.total b{color:var(--gold);font-size:26px}
.main{flex:1;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;min-height:0}
.feed{display:flex;flex-direction:column-reverse;gap:10px;overflow:hidden}
.item{background:var(--card);border-radius:12px;padding:12px 16px;font-size:16px;line-height:1.5;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.item .who{font-weight:900}
.item .to{color:var(--gold);font-weight:900}
.item .k{font-size:13px;color:var(--ink2)}
.item.coin{background:#221d12;border:1px solid var(--gold)}
.bars{display:flex;flex-direction:column;gap:9px;justify-content:center}
.brow{display:grid;grid-template-columns:86px 1fr 46px;gap:10px;align-items:center;font-size:14px}
.nm{font-weight:900;text-align:right;white-space:nowrap;overflow:hidden}
.track{height:20px;background:var(--card2);border-radius:6px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-deep));border-radius:0 5px 5px 0;transition:width .6s;min-width:2px}
.val{font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
</style></head><body>
<header><h1 class="logo">ビジスタ<b>.</b></h1><span style="color:var(--ink2);font-size:14px">会場のみんなの応援がリアルタイムに流れています</span><span class="total">熱量 <b id="heat">0</b><span style="font-size:11px">/100</span>　関係人口 <b id="uniq">0</b><span style="font-size:11px">人</span>　応援 <b id="total">0</b></span></header>
<div class="main">
  <div class="feed" id="feed"></div>
  <div class="bars" id="bars"></div>
</div>
<script>
const TEAMS = ["不登校", "まりあ", "友達の輪", "1年生", "高校生", "たちまち", "海", "バビロン"];
const KINDS = {"cheer": "👏 応援してる！", "user": "🙋 利用者になりたい", "intro": "🤝 人を紹介できる", "spread": "📣 広めたい", "coin": "🪙 ビジスタ"};
let lastId = 0;
const feed = document.getElementById('feed');
async function tick(){
  try{
    const r = await fetch('https://qfptslfrasgidlaokhpx.supabase.co/functions/v1/ohineri/api/feed?after='+lastId);
    const rows = await r.json();
    for(const row of rows){
      lastId = Math.max(lastId, row.id);
      const d = document.createElement('div');
      d.className = 'item' + (row.kind==='coin'?' coin':'');
      const who = document.createElement('span'); who.className='who'; who.textContent = row.name || '匿名';
      const to = document.createElement('span'); to.className='to'; to.textContent = ' → ' + row.team + ' ';
      const k = document.createElement('span'); k.className='k'; k.textContent = KINDS[row.kind]||row.kind;
      d.appendChild(who); d.appendChild(to); d.appendChild(k);
      if(row.message){ const m=document.createElement('div'); m.textContent='「'+row.message+'」'; d.appendChild(m); }
      feed.appendChild(d);
      while(feed.children.length>12) feed.removeChild(feed.firstChild);
    }
    const rr = await fetch('https://qfptslfrasgidlaokhpx.supabase.co/functions/v1/ohineri/api/stats');
    const agg = await rr.json();
    document.getElementById('total').textContent = agg.total;
    document.getElementById('heat').textContent = agg.heat;
    document.getElementById('uniq').textContent = agg.uniq;
    const bars = document.getElementById('bars');
    bars.innerHTML='';
    const max = Math.max(1,...TEAMS.map(t=>agg.teams[t]?.count||0));
    for(const t of TEAMS){
      const c = agg.teams[t]?.count||0;
      const row = document.createElement('div'); row.className='brow';
      const nm=document.createElement('span');nm.className='nm';nm.textContent=t;
      const tr=document.createElement('div');tr.className='track';
      const f=document.createElement('div');f.className='fill';f.style.width=(c/max*100)+'%';tr.appendChild(f);
      const v=document.createElement('span');v.className='val';v.textContent=c;
      row.appendChild(nm);row.appendChild(tr);row.appendChild(v);
      bars.appendChild(row);
    }
    if(agg.minutes){
      const sp=document.createElement('div');
      sp.style.cssText='display:flex;align-items:flex-end;gap:4px;height:44px;margin-top:14px';
      const mx=Math.max(1,...agg.minutes.map(m=>m.c));
      for(const m of agg.minutes){
        const b=document.createElement('div');
        b.style.cssText='flex:1;background:'+(m.c?'#c8871d':'#24252e')+';border-radius:3px 3px 0 0;height:'+Math.max(8,m.c/mx*100)+'%';
        sp.appendChild(b);
      }
      const lb=document.createElement('div');
      lb.style.cssText='font-size:10px;color:#8f8d97;margin-top:4px';
      lb.textContent='熱気の推移（直近10分・1分ごとの応援数）';
      bars.appendChild(sp); bars.appendChild(lb);
    }
  }catch(e){}
  setTimeout(tick, 2000);
}
tick();
</script></body></html>
