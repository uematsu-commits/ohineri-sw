<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ビジスタ — 応援を投げよう</title><style>
:root{--bg:#0f1013;--card:#1c1d24;--card2:#24252e;--ink:#f2efe6;--ink2:#8f8d97;--gold:#e8b04b;--gold-deep:#c8871d;--red:#e0454f;--line:#2c2d35}
*{box-sizing:border-box;margin:0;font-family:'Hiragino Sans','Noto Sans JP',sans-serif}
body{background:var(--bg);color:var(--ink);min-height:100vh}
.logo{font-weight:900;letter-spacing:.02em}
.logo b{color:var(--gold)}
button{font-family:inherit}

body{padding:18px 16px 40px;max-width:520px;margin:0 auto}
h1{font-size:22px;margin-bottom:2px}
.sub{color:var(--ink2);font-size:12px;margin-bottom:16px;line-height:1.6}
.sec{font-size:12px;font-weight:800;letter-spacing:.15em;color:var(--gold);margin:18px 0 8px}
.teams{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.team{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 3px;font-size:12px;line-height:1.35;font-weight:800;color:var(--ink);text-align:center;cursor:pointer}
.team.sel{border-color:var(--gold);background:#221d12;color:var(--gold)}
textarea{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;color:var(--ink);padding:11px 13px;font-size:14px;height:64px;resize:none}
textarea:focus{outline:2px solid var(--gold)}
input{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:10px;color:var(--ink);padding:9px 13px;font-size:13px}
.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.act{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:13px 6px;font-size:14px;font-weight:800;color:var(--ink);cursor:pointer}
.act:active{transform:scale(.96)}
.act.sel{border-color:var(--gold);background:#221d12;color:var(--gold)}
.send{width:100%;margin-top:14px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#161105;border:0;font-size:16.5px;font-weight:900;padding:16px;border-radius:12px;cursor:pointer}
.send:active{transform:scale(.98)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);background:var(--gold);color:#161105;font-weight:900;font-size:14px;border-radius:99px;padding:11px 24px;transition:transform .25s;z-index:9;white-space:nowrap}
#toast.on{transform:translateX(-50%) translateY(0)}
a{color:var(--ink2)}
#floatLayer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:8}
.floatR{position:absolute;bottom:-70px;display:flex;flex-direction:column;align-items:center;gap:2px;animation:floatUp 3.6s ease-out forwards}
.floatR .ic{font-size:34px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));animation:wobble 1.1s ease-in-out infinite alternate}
.floatR.big .ic{font-size:46px}
.floatR .bub{max-width:180px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:4px 9px;font-size:11px;line-height:1.45;color:var(--ink);text-align:center;word-break:break-all}
.floatR.big .bub{border-color:var(--gold)}
.floatR .tm{font-size:10px;font-weight:800;color:var(--gold)}
@keyframes floatUp{0%{transform:translateY(0);opacity:0}8%{opacity:1}75%{opacity:1}100%{transform:translateY(-82vh);opacity:0}}
@keyframes wobble{from{transform:translateX(-7px) rotate(-4deg)}to{transform:translateX(7px) rotate(4deg)}}
</style></head><body>
<h1 class="logo">ビジスタ<b>.</b></h1>
<p class="sub">応援したいチームを選んで、応援を投げてください。応援は会場スクリーンに流れ、発表チームに届きます。匿名OK・本物のお金は使いません。</p>
<div class="sec">1. チームを選ぶ</div>
<div class="teams" id="teams"></div>
<div id="teamInfo" style="display:none;margin-top:10px;background:#221d12;border:1.5px solid var(--gold);border-radius:12px;padding:11px 14px;font-size:12.5px;line-height:1.7"><b id="tiName" style="color:var(--gold)"></b><span id="tiDesc" style="color:var(--ink)"></span></div>
<div class="sec">2. 応援を選ぶ（タップで選択）</div>
<div class="acts">
  <button class="act" data-k="user">🙋 利用者になりたい</button>
  <button class="act" data-k="intro">🤝 人を紹介できる</button>
  <button class="act" data-k="spread">📣 広めたい</button>
  <button class="act coin" data-k="coin">🔥 エールを投げる</button>
</div>
<div class="sec">3. ひとことメッセージ（任意・一緒に届きます）</div>
<textarea id="msg" maxlength="120" placeholder="例）その課題、うちの会社でも困ってます！"></textarea>
<div style="margin-top:8px"><input id="name" maxlength="20" placeholder="お名前（任意・空欄で匿名）"></div>
<button class="send" id="sendBtn">🚀 応援を送る（何回でもOK）</button>
<div class="sec" style="margin-top:24px">みんなの応援（リアルタイム）</div>
<div id="liveFeed" style="display:flex;flex-direction:column;gap:6px"></div>
<p style="margin-top:26px;font-size:11px;color:var(--ink2)">結果はイベント後に各チームへ共有されます ／ <a href="results.html">結果ページ</a></p>
<div id="floatLayer"></div>
<div id="toast">送りました！</div>
<script>
const TEAMS = ["山P", "うちのまりあは面倒くさがり", "くびMIKAN社中", "高校生", "じぶん時間", "たちまちエンディングノート", "友達の輪", "バビロンフィーバー", "ピッチャー"];
const TEAM_INFO = {
  "山P": "『きっかけラボ』— 失敗の練習が出来る教室",
  "うちのまりあは面倒くさがり": "『Sassy』— 恋愛の悩みの解決を手助けするサイト",
  "くびMIKAN社中": "『海の学校』— 瀬戸内の限界集落・久比で、子どもたちが“生きる力”と“暮らしの感覚”を取り戻す自然教育プログラム",
  "高校生": "『大会実績を、\"すごい\"で終わらせない』— 優秀な高校生と企業との接点を作る",
  "じぶん時間": "『DINO SOLO CLUB』— ひとりを、冒険に変える。",
  "たちまちエンディングノート": "『なりたい自分に変身！テクマクマヤコン』— 老後の不安を言語化して次に何をすればいいか分かる",
  "友達の輪": "『RETREAT MAKERS』— 仲間の輪を広げるためのリクルートイベント",
  "バビロンフィーバー": "『勢い研究所』— 新入社員（社会人1年目から3年目）の「勢い」を加速させるためのサービス",
  "ピッチャー": "『ビジスタ』— ビジコン会場に、マツダスタジアムの盛り上がりを。ビジコン管理・活性化ツール（このアプリを作ったチームです）"
};
let team = null;
try{ team = localStorage.getItem('oh_team'); }catch(e){}
if(team && !TEAMS.includes(team)) team = null;
let dev='';try{dev=localStorage.getItem('oh_dev')||'';if(!dev){dev=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('oh_dev',dev);}}catch(e){dev='anon'+Math.floor(Math.random()*1e9);}
const teamsEl = document.getElementById('teams');
TEAMS.forEach(t=>{
  const b=document.createElement('button');
  b.className='team'+(t===team?' sel':'');
  b.textContent=t;
  b.onclick=()=>{team=t;try{localStorage.setItem('oh_team',t)}catch(e){};document.querySelectorAll('.team').forEach(x=>x.classList.toggle('sel',x.textContent===t));showInfo(t);};
  teamsEl.appendChild(b);
});
function showInfo(t){
  const p=document.getElementById('teamInfo');
  const d=TEAM_INFO[t]||'';
  if(!d){p.style.display='none';return;}
  document.getElementById('tiName').textContent=t+'： ';
  document.getElementById('tiDesc').textContent=d;
  p.style.display='block';
}
if(team) showInfo(team);
let kind=null;
document.querySelectorAll('.act').forEach(b=>b.onclick=()=>{
  kind=b.dataset.k;
  document.querySelectorAll('.act').forEach(x=>x.classList.toggle('sel',x.dataset.k===kind));
});
let busy=false;
document.getElementById('sendBtn').onclick=async()=>{
  if(busy) return;
  if(!team){ toast('先にチームを選んでください'); return; }
  if(!kind){ toast('応援の種類を選んでください'); return; }
  busy=true;
  try{
    const res = await fetch('https://qfptslfrasgidlaokhpx.supabase.co/functions/v1/ohineri/api/support',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({team,kind,device:dev,message:document.getElementById('msg').value.trim(),name:document.getElementById('name').value.trim()})});
    if(!res.ok) throw new Error();
    document.getElementById('msg').value='';
    toast(team+' に送りました！');
  }catch(e){ toast('送信に失敗しました。電波を確認してもう一度'); }
  busy=false;
};
const KINDS_L = {cheer:'👏 応援してる！',user:'🙋 利用者になりたい',intro:'🤝 人を紹介できる',spread:'📣 広めたい',coin:'🔥 エール'};
const KINDS_IC = {cheer:'👏',user:'🙋',intro:'🤝',spread:'📣',coin:'🔥'};
function spawnFloat(row){
  const layer=document.getElementById('floatLayer');
  const f=document.createElement('div');
  f.className='floatR'+(row.kind==='coin'?' big':'');
  f.style.left=(8+Math.random()*72)+'%';
  const ic=document.createElement('div'); ic.className='ic'; ic.textContent=KINDS_IC[row.kind]||'👏'; f.appendChild(ic);
  const tm=document.createElement('div'); tm.className='tm'; tm.textContent='→ '+row.team; f.appendChild(tm);
  if(row.message){const b=document.createElement('div'); b.className='bub'; b.textContent=row.message; f.appendChild(b);}
  layer.appendChild(f);
  setTimeout(()=>f.remove(), 3800);
}
let feedLast = 0, feedInit = true;
async function pollFeed(){
  try{
    const r = await fetch('https://qfptslfrasgidlaokhpx.supabase.co/functions/v1/ohineri/api/feed?after='+feedLast);
    const rows = await r.json();
    const box = document.getElementById('liveFeed');
    rows.forEach((row,i)=>{
      feedLast = Math.max(feedLast, row.id);
      if(!feedInit) setTimeout(()=>spawnFloat(row), Math.min(i,10)*320);
      const d = document.createElement('div');
      d.style.cssText='background:var(--card);border-radius:10px;padding:8px 12px;font-size:12px;line-height:1.55'+(row.kind==='coin'?';border:1px solid var(--gold)':'');
      const who=document.createElement('b'); who.textContent=(row.name||'匿名');
      const to=document.createElement('span'); to.style.color='var(--gold)'; to.style.fontWeight='800'; to.textContent=' → '+row.team+' ';
      const k=document.createElement('span'); k.style.color='var(--ink2)'; k.textContent=KINDS_L[row.kind]||row.kind;
      d.appendChild(who); d.appendChild(to); d.appendChild(k);
      if(row.created_at){
        const tt=document.createElement('span');
        tt.style.cssText='float:right;color:var(--ink2);font-size:10.5px';
        try{ tt.textContent=new Date(row.created_at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}); }catch(e){}
        d.appendChild(tt);
      }
      if(row.message){const m=document.createElement('div'); m.textContent='「'+row.message+'」'; d.appendChild(m);}
      box.prepend(d);
      while(box.children.length>8) box.removeChild(box.lastChild);
    });
    feedInit = false;
  }catch(e){}
  setTimeout(pollFeed, 3500);
}
pollFeed();
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),1600);}
</script></body></html>
